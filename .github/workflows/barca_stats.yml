name: FC Barcelona Stats Scraper

on:
  workflow_dispatch:
    # Permite ejecutar el Action manualmente desde la pestaña Actions de GitHub

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código fuente
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/actions-setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias necesarias
      run: |
        python -m pip install --upgrade pip
        pip install pandas beautifulsoup4 requests lxml tabulate

    - name: Ejecutar script de estadísticas del FC Barcelona
      run: |
        python get_barca_stats.py

    - name: Subir resultados como artefactos del flujo de trabajo
      uses: actions/upload-artifact@v4
      with:
        name: estadisticas-barca
        path: resultados/

    - name: Confirmar y subir cambios si hay actualizaciones
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add resultados/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática: Estadísticas FC Barcelona [skip ci]" && git push)
